<?xml version="1.0" encoding="UTF-8"?>
<!-- RealNews app icon (tools/icon.svg: UIPrerenderedIcon bakes the rounded corners later).
     RSS broadcast waves in white with subtle shadow and embossed depth on a classic warm orange aqua tile.
     Features the signature iOS 6 gloss curve and top rim highlight matching samcejko's app family. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 160 160">
  <defs>
    <!-- Background aqua-orange gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB366"/>
      <stop offset="0.46" stop-color="#FF7A00"/>
      <stop offset="0.50" stop-color="#E05500"/>
      <stop offset="1" stop-color="#FF6A00"/>
    </linearGradient>

    <!-- Top gloss curve gradient -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle radial sheen from top-left -->
    <radialGradient id="sheen" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow for the RSS emblem -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="160" height="160" fill="url(#bg)"/>
  <rect width="160" height="160" fill="url(#sheen)"/>

  <!-- RSS Waves & Dot Emblem -->
  <!-- Shadow layer -->
  <g transform="translate(0, 3)" filter="url(#softShadow)" opacity="0.35">
    <!-- Dot -->
    <circle cx="48" cy="112" r="13" fill="#802000"/>
    <!-- Inner wave -->
    <path d="M 35,74 A 38,38 0 0,1 73,112 L 87,112 A 52,52 0 0,0 35,60 Z" fill="#802000"/>
    <!-- Outer wave -->
    <path d="M 35,42 A 70,70 0 0,1 105,112 L 121,112 A 86,86 0 0,0 35,26 Z" fill="#802000"/>
  </g>

  <!-- Main Crisp White Emblem -->
  <g>
    <!-- Dot -->
    <circle cx="48" cy="112" r="13" fill="#ffffff"/>
    <!-- Inner wave -->
    <path d="M 35,74 A 38,38 0 0,1 73,112 L 87,112 A 52,52 0 0,0 35,60 Z" fill="#ffffff"/>
    <!-- Outer wave -->
    <path d="M 35,42 A 70,70 0 0,1 105,112 L 121,112 A 86,86 0 0,0 35,26 Z" fill="#ffffff"/>

    <!-- Subtle inner highlight on top edge of dot and waves -->
    <path d="M 35,42 A 70,70 0 0,1 105,112" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.8"/>
  </g>

  <!-- The signature iOS 6 gloss curve across the top half -->
  <path d="M0,0 L160,0 L160,70 Q80,94 0,70 Z" fill="url(#gloss)"/>

  <!-- A thin, light rim along the very top edge -->
  <line x1="0" y1="0.5" x2="160" y2="0.5" stroke="#ffffff" stroke-opacity="0.65" stroke-width="1"/>
</svg>
